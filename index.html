<!doctype html>
<!--
  Cisco Cheat Sheet v2 : site statique découpé en fichiers.
    styles.css : thème, mise en page, cartes, blocs de code, QCM
    data.js    : les fiches (le tableau D, une entrée par technologie) — à éditer pour le contenu
    extras.js  : schémas de topologie et exemples de sortie affichés dans le Guide
    quiz.js    : les questions du mode Entraînement
    app.js     : la logique (Guide, Référence, Favoris, Entraînement)
  Historique des versions : CHANGELOG.md
-->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Cisco Cheat Sheet</title>
    <link rel="icon" type="image/png" href="logo_ciscocheatsheet.png" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="logo_ciscocheatsheet.png" />
    <!-- Applique le thème mémorisé avant l'affichage, pour éviter un flash clair / sombre -->
    <script>
      try {
        var t = JSON.parse(localStorage.getItem("theme"));
        if (t) document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- ?v=N : augmenter N à chaque modification d'un fichier CSS ou JS
         pour que Cloudflare serve la nouvelle version au lieu de sa copie en cache -->
    <link rel="stylesheet" href="styles.css?v=7" />
  </head>
  <body>
    <div class="app">
      <aside>
        <div class="brand">
          <svg width="30" height="26" viewBox="0 0 30 26" aria-hidden="true">
            <g fill="#049fd9">
              <rect x="0" y="16" width="5" height="10" rx="2.5" />
              <rect x="8" y="10" width="5" height="16" rx="2.5" />
              <rect x="16" y="5" width="5" height="21" rx="2.5" />
              <rect x="24" y="0" width="5" height="26" rx="2.5" />
            </g>
          </svg>
          <div>Cisco<br />Cheat Sheet<small>Commandes IOS</small></div>
        </div>
        <nav id="nav" aria-label="Vues"></nav>
        <button id="th" title="Basculer thème clair / sombre">◐ Thème</button>
        <span id="verline"><span id="ver"></span> · <a href="v1/" title="Ouvrir l'ancienne version (v1.0)">version précédente</a></span>
        <button id="burger" aria-label="Ouvrir le menu" aria-expanded="false">☰</button>
      </aside>
      <main>
        <div class="hero">
          <label class="prompt"
            ><b>Switch#</b
            ><input id="q" type="search" autocomplete="off" aria-label="Rechercher une commande"
          /></label>
          <div class="bar" id="flt"></div>
          <div class="bar rec" id="rec"></div>
        </div>
        <div id="out"></div>
      </main>
    </div>
    <!-- Les données (data.js, extras.js, quiz.js) doivent être chargées avant app.js -->
    <script src="data.js?v=8"></script>
    <script src="extras.js?v=1"></script>
    <script src="quiz.js?v=2"></script>
    <script src="app.js?v=7"></script>
  </body>
</html>
