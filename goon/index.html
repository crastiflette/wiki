<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>🤫</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1.5rem; text-align: center; padding: 1rem;
    background: radial-gradient(circle at 50% 40%, #3a0a4a 0%, #0a0010 70%);
    color: #fff; font-family: "Courier New", monospace; overflow: hidden;
  }
  .badge {
    font-size: .8rem; letter-spacing: .4em; text-transform: uppercase;
    color: #ff4fd8; border: 1px solid #ff4fd8; padding: .4rem 1rem; border-radius: 99px;
    animation: blink 1.5s steps(2) infinite;
  }
  h1 {
    font-size: clamp(2rem, 8vw, 5rem); line-height: 1.15;
    background: linear-gradient(90deg, #ff4fd8, #ffd84f, #4ffff0, #ff4fd8);
    background-size: 300% 100%; -webkit-background-clip: text; background-clip: text;
    color: transparent; animation: slide 4s linear infinite;
  }
  .heart { font-size: 4rem; animation: beat 1s ease-in-out infinite; }
  @keyframes slide { to { background-position: 300% 0; } }
  @keyframes beat { 50% { transform: scale(1.3); } }
  @keyframes blink { 50% { opacity: .3; } }
</style>
</head>
<body>
  <div class="badge">🔒 page secrète</div>
  <div class="heart">❤️</div>
  <h1>J'aime<br>Antoine Gobatto</h1>
</body>
</html>
